name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.1.0" "platform-tools"
          yes | sdkmanager --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :imaging:test --console=plain --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --console=plain --stacktrace

      - name: Rename APK
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          cp app/build/outputs/apk/debug/app-debug.apk "shiguang-ccd-${SHORT_SHA}-debug.apk"
          echo "APK=shiguang-ccd-${SHORT_SHA}-debug.apk" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shiguang-ccd-debug-apk
          path: ${{ env.APK }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK }}
          generate_release_notes: true
          fail_on_unmatched_files: true
